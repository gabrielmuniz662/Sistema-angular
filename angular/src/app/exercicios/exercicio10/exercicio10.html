<div class="container">
  <h2>Login Simulado</h2>
  <div class="form-group">
    <label>Usuário:</label>
    <input type="text" [(ngModel)]="usuario" placeholder="Digite seu usuário..." />
  </div>
  <div class="form-group">
    <label>Senha:</label>
    <input type="password" [(ngModel)]="senha" placeholder="Digite sua senha..." />
  </div>

  <button [disabled]="!camposPreenchidos" (click)="entrar()" class="btn-login">Entrar</button>

  <div class="welcome-box" *ngIf="mensagemBoasVindas">
    <p>{{ mensagemBoasVindas }}</p>
  </div>
</div>
